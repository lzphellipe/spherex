[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex-moving-objects"
version = "0.1.0"
description = "Detecção de objetos em movimento em imagens multiépoca do SPHEREx, com avaliação honesta (NASA Space Apps 2026 — Planet X and SPHEREx)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "astropy>=6.1",
  "photutils>=2.0",
  "scikit-learn>=1.5",
  "torch>=2.3",
  "matplotlib>=3.9",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
spherex = "spherex.interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spherex.interface" = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: testes que acessam IRSA/JPL (rodar com -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
